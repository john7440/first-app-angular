<nav class="navbar navbar-expand-sm bg-light navbar-light p-3">
  <div class="container-fluid">
    <a class="navbar-brand" routerLink="/trainings">TRAININGS</a>

    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#mainNavbar"
      aria-controls="mainNavbar"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="mainNavbar">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link" routerLink="/trainings" routerLinkActive="active">Formations</a>
        </li>
      </ul>

      <div class="d-flex ms-auto align-items-center gap-2">
        <input
        class="form-control form-control-sm"
        style="width: 260px;"
        type="search"
        placeholder="Rechercher une formation..."
        [ngModel]="search.trainingQuery()"
        (ngModelChange)="search.setTrainingQuery($event)"
        />

        <button class="btn btn-dark position-relative btn-sm px-4 py-2" routerLink="/cart" data-bs-toggle="modal" data-bs-target="#cartModal">
                  <i class="bi bi-cart4 me-2"></i> 
                  <span class="d-none d-sm-inline">Panier</span>
                  <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger border border-light">
                      {{ cart.totalQuantity() }}
                  </span>
              </button>
  </div>
</div>
