<nav class="navbar navbar-expand-sm bg-light navbar-light p-3">
  <div class="container-fluid">
    <a class="navbar-brand" routerLink="/trainings">TRAININGS</a>

    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#mainNavbar"
      aria-controls="mainNavbar"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="mainNavbar">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link" routerLink="/trainings" routerLinkActive="active">Acceuil</a>
        </li>
      </ul>

      <div class="d-flex ms-auto align-items-center gap-2">
        <input
          class="form-control form-control-sm"
          style="width: 260px;"
          type="search"
          placeholder="Rechercher une formation..."
          [ngModel]="search.trainingQuery()"
          (ngModelChange)="search.setTrainingQuery($event)"
        />

        <!-- Bouton Connexion/Déconnexion -->
        @if (auth.isAuthenticated()) {
          <div class="dropdown">
            <button class="btn btn-outline-primary btn-sm px-3 py-2 dropdown-toggle" 
                    type="button" 
                    data-bs-toggle="dropdown" 
                    aria-expanded="false">
              <i class="bi bi-person-circle me-1"></i>
              {{ auth.getCurrentUser()?.email }}
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><a class="dropdown-item" href="#"><i class="bi bi-person me-2"></i>Profil</a></li>
              <li><a class="dropdown-item" routerLink="/orders"><i class="bi bi-cart4 me-2"></i>Commandes</a></li>
              @if (auth.getCurrentUser() && auth.isAdmin(auth.getCurrentUser()!)) {
                <li><a class="dropdown-item" routerLink="/admin"><i class="bi bi-gear me-2"></i>Administration</a></li>
              }
              <li><hr class="dropdown-divider"></li>
              <li><button class="dropdown-item text-danger" type="button" (click)="logout()"><i class="bi bi-box-arrow-right me-2"></i>Déconnexion</button></li>
            </ul>
          </div>
        } @else {
          <button class="btn btn-outline-secondary btn-sm px-3 py-2" routerLink="/login">
            <i class="bi bi-person-circle me-1"></i>
            <span class="d-none d-sm-inline">Connexion</span>
          </button>
        }

        <!-- Bouton Panier -->
        <button class="btn btn-dark position-relative btn-sm px-4 py-2" 
                routerLink="/cart" 
                data-bs-toggle="modal" 
                data-bs-target="#cartModal">
          <i class="bi bi-cart4 me-2"></i> 
          <span class="d-none d-sm-inline">Panier</span>
          <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger border border-light">
            {{ cart.totalQuantity() }}
          </span>
        </button>
      </div>
    </div>
  </div>
</nav>
