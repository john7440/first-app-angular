<h2 class="mb-3">Mes commandes</h2>

<ng-container *ngIf="orders$ | async as orders; else loading">
  <div *ngIf="orders.length === 0" class="alert alert-info">
    Aucune commande
  </div>

  <div *ngIf="orders.length > 0" class="table-responsive">
    <table class="table table-striped table-hover align-middle">
      <thead>
        <tr>
          <th>#</th>
          <th>Date</th>
          <th>Statut</th>
          <th class="text-end">Total</th>
          <th></th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let o of orders">
          <td>#{{ o.id }}</td>
          <td>{{ o.createdAt | date:'short' }}</td>
          <td>
            <span
              class="badge"
              [ngClass]="{
                'bg-warning text-dark': o.status === 'pending',
                'bg-success': o.status === 'confirmed',
                'bg-danger': o.status === 'cancelled'
              }"
            >
              {{ o.status }}
            </span>
          </td>
          <td class="text-end">{{ o.totalAmount }} €</td>
          <td class="text-end">
            <a class="btn btn-sm btn-outline-primary"
               [routerLink]="['/orders', o.id]">
              Détails
            </a>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</ng-container>

<ng-template #loading>
  <div class="d-flex align-items-center gap-2">
    <div class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></div>
    <span>Chargement…</span>
  </div>
</ng-template>
